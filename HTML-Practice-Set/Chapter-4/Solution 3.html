
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation Booking Form</title>
</head>
<body>

    <h1>Dream Vacation Booking</h1>
    <p>Fill in the details to plan your next trip!</p>

    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
        <br><br>

        <label for="destination">Choose Destination:</label>
        <select id="destination" name="destination" required>
            <option value="">Select a destination</option>
            <option value="goa">Goa</option>
            <option value="manali">Manali</option>
            <option value="jaipur">Jaipur</option>
            <option value="kerala">Kerala</option>
        </select>
        <br><br>

        <label for="date">Travel Date:</label>
        <input type="date" id="date" name="date" required>
        <br><br>

        <label for="people">Number of Travellers:</label>
        <input type="number" id="people" name="people"
               min="1" max="20" value="1" required>
        <br><br>

        <label for="message">Special Requests:</label>
        <br>
        <textarea id="message" name="message"
                  rows="4" cols="30"
                  placeholder="Any special requirements?"></textarea>
        <br><br>

        <button type="submit">Book My Vacation</button>
        <button type="reset">Clear Form</button>

    </form>

</body>
</html>
