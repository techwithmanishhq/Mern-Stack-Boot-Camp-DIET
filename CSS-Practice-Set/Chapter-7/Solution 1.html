
<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: grid;

            grid-template-columns: 1fr 2fr;
            grid-template-rows: 100px 300px;

            gap: 10px;
            padding: 10px;
        }

        .header {
            background-color: black;
            color: white;

            grid-column: 1 / 3;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sidebar {
            background-color: lightblue;
            padding: 20px;
        }

        .content {
            background-color: lightgreen;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">

        <header class="header">
            <h1>My Website Header</h1>
        </header>

        <div class="sidebar">
            <h2>Sidebar</h2>
        </div>

        <div class="content">
            <h2>Main Content</h2>
            <p>Welcome to my website.</p>
        </div>

    </div>

</body>
</html>
