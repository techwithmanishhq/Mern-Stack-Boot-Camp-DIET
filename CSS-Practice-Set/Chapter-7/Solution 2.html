
<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Navbar */
        .navbar {
            background-color: black;
            color: white;
            padding: 20px;

            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .links {
            text-align: right;
        }

        .links a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        /* Two Boxes */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .box1 {
            background-color: red;
            height: 250px;
        }

        .box2 {
            background-color: green;
            height: 250px;
        }

        /* Profile Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .navbar {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .links {
                text-align: center;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <h2>TechWithManishHQ</h2>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <!-- Two Boxes -->
    <div class="container">

        <div class="box1">
            <h2>Div 1</h2>
        </div>

        <div class="box2">
            <h2>Div 2</h2>
        </div>

    </div>

    <!-- Profile Cards -->
    <div class="cards">

        <div class="card">
            <h2>Manna</h2>
            <p>Web Developer</p>
        </div>

        <div class="card">
            <h2>Manish</h2>
            <p>AI/ML Engineer</p>
        </div>

        <div class="card">
            <h2>Mann</h2>
            <p>Software Developer</p>
        </div>

    </div>

</body>
</html>
