
<!DOCTYPE html>
<html>
<head>
    <title>Media Queries</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: green;
            height: 100vh;
        }

        h1 {
            text-align: center;
            padding: 50px;
        }

        /* Medium Devices */
        @media (min-width: 768px) and (max-width: 1023px) {
            body {
                background-color: red;
            }
        }

        /* Small Devices */
        @media (max-width: 767px) {
            body {
                background-color: yellow;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Website</h1>

</body>
</html>
