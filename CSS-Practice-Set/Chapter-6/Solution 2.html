
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>

    <style>
        .container {
            display: flex;
            justify-content: space-between;

            background-color: lightgray;
            padding: 20px;
        }

        .left {
            width: 40%;
            height: 300px;
            background-color: red;
        }

        .right {
            width: 40%;
            height: 300px;
            background-color: green;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="left">
            <h2>Left Box</h2>
        </div>

        <div class="right">
            <h2>Right Box</h2>
        </div>

    </div>

</body>
</html>
