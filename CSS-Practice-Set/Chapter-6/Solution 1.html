
<!DOCTYPE html>
<html>
<head>
    <title>Float Layout</title>

    <style>
        .container {
            background-color: lightgray;
            padding: 20px;
        }

        .left {
            width: 40%;
            height: 300px;
            background-color: red;
            float: left;
        }

        .right {
            width: 40%;
            height: 300px;
            background-color: green;
            float: right;
        }

        .clear {
            clear: both;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="left">
            <h2>Left Box</h2>
        </div>

        <div class="right">
            <h2>Right Box</h2>
        </div>

        <div class="clear"></div>

    </div>

</body>
</html>
