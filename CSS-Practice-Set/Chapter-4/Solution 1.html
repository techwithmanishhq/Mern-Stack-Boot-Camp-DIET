
<!DOCTYPE html>
<html>
<head>
    <title>CSS Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: black;
            color: white;
            padding: 20px;
        }

        .left {
            background-color: red;
            width: 50%;
            height: 400px;
            float: left;
        }

        .right {
            background-color: green;
            width: 50%;
            height: 400px;
            float: right;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2>My Website</h2>
    </nav>

    <div class="left">
        <h2>Left Div</h2>
    </div>

    <div class="right">
        <h2>Right Div</h2>
    </div>

</body>
</html>
