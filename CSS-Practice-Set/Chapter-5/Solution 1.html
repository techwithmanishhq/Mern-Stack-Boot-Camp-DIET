
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: darkblue;
            width: 100%;
            padding: 1rem;
            box-sizing: border-box;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 1rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
