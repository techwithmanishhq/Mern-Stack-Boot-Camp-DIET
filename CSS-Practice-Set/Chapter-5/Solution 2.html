
<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar</title>

    <style>
        body {
            margin: 0;
        }

        .navbar {
            background-color: black;
            padding: 20px;

            position: sticky;
            top: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        .content {
            height: 1500px;
            background-color: lightblue;
            padding: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <h1>Scroll the page</h1>
        <p>The navbar will stick to the top.</p>
    </div>

</body>
</html>
