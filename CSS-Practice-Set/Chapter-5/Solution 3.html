
<!DOCTYPE html>
<html>
<head>
    <title>List Style</title>

    <style>
        ul {
            list-style: square;
            background-color: lightblue;
            padding: 30px;
        }

        li {
            margin: 10px;
        }
    </style>
</head>
<body>

    <h1>My Skills</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

</body>
</html>
