
<!DOCTYPE html>
<html>
<head>
    <title>Z Index</title>

    <style>
        .container {
            position: relative;
            height: 400px;
        }

        .box1 {
            background-color: red;
            width: 200px;
            height: 200px;

            position: absolute;
            top: 50px;
            left: 50px;

            z-index: 1;
        }

        .box2 {
            background-color: blue;
            width: 200px;
            height: 200px;

            position: absolute;
            top: 100px;
            left: 100px;

            z-index: 2;
        }

        .box3 {
            background-color: green;
            width: 200px;
            height: 200px;

            position: absolute;
            top: 150px;
            left: 150px;

            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="box1">Red Box</div>

        <div class="box2">Blue Box</div>

        <div class="box3">Green Box</div>

    </div>

</body>
</html>
