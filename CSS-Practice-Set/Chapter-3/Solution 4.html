
<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing</title>

    <style>
        .content {
            width: 300px;
            height: 200px;

            background-color: lightblue;

            border: 5px solid blue;
            padding: 20px;

            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Content Box</h1>
        <p>Learning CSS Box Sizing.</p>
    </div>

</body>
    </html>
    
<!-- Answer: The total width and height remain within the specified dimensions when using border-box. -->
