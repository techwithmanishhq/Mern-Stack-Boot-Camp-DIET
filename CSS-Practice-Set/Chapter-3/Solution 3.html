
<!DOCTYPE html>
<html>
<head>
    <title>Margin Collapse</title>

    <style>
        .content {
            height: 200px;
            background-color: lightblue;
            margin-bottom: 50px;
        }

        footer {
            background-color: lightgreen;
            height: 100px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Content Box</h1>
    </div>

    <footer>
        <h2>Footer</h2>
    </footer>

</body>
</html>

<!-- Answer: Yes, margin collapse occurs. The vertical gap is 50px, not 80px. -->
