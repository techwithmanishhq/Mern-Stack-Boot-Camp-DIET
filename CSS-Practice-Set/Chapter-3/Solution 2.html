
<!DOCTYPE html>
<html>
<head>
    <title>Border and Margin</title>

    <style>
        header {
            background-color: lightblue;
            border: 3px solid blue;
            margin: 20px;
            padding: 20px;
        }

        .content {
            background-color: lightgray;
            border: 3px solid black;
            margin: 30px;
            padding: 40px;
        }

        footer {
            background-color: lightgreen;
            border: 3px solid green;
            margin: 20px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Website Header</h1>
    </header>

    <div class="content">
        <h2>Main Content</h2>
        <p>This is the content section.</p>
    </div>

    <footer>
        <h3>Website Footer</h3>
    </footer>

</body>
</html>
